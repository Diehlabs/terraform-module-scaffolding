name: Terraform Module Build
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terrascan:
    permissions:
      contents: read
      security-events: write
    uses: Diehlabs/shared-workflows/.github/workflows/terrascan.yml@main

  terratest:
    permissions:
      contents: read
      checks: write
    uses: Diehlabs/shared-workflows/.github/workflows/terratest.yml@main
    with:
      terraform_version: 1.0.8
      working_directory: tests

  release:
    needs: [terrascan, terratest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: Diehlabs/shared-workflows/.github/workflows/github-release.yml@main
