name: Terraform Module CI
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: write
      checks: write
      security-events: write
    uses: Diehlabs/shared-workflows/.github/workflows/terraform-module.yml@5fdd2bdbaa2f3db75c4082dd4f262fedcbabce5e # v0.2.13
    with:
      terraform_version: 1.0.8
      test_directory: tests
    secrets: inherit
